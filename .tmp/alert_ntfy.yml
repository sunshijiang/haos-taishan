name: Alert on build failure

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  alert:
    name: Open an issue for the failed build
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Placeholder
        run: echo placeholder
      - name: Send an out-of-band notification
        if: ${{ secrets.NTFY_TOPIC != '' }}
        run: |
          curl -fsS -H "Title: HAOS Taishan build failed" \
               -H "Priority: high" \
               -H "Tags: warning" \
               -d "Build failed: ${{ github.event.workflow_run.html_url }}" \
               "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
